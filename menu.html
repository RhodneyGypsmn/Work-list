<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" />
    content="width=device-widht, intial-scale=1.0"
    <title>Menu Example</title>
    <style>
      body {font-family: Arial, Helvetica, sans-serif;}
      nav {background-color: #333;
          overflow: hidden;}
      nav a {
          float: left
          display: block;
          color: white;
          text-allign: center;
          padding: 14px 20px;
          text-decoration; none
      }
      nav a:hover {
          background-color: #575757;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#service">Services</a>
      <a href="#contacts">Contacts</a>
    </nav>
    <div id="Menu" class="menu-section">
      <h2>Our Menu</h2>
      <div class="dish">
        <h3>Grilled Chicekn</h3>
        <p>Served with vegetables and a choice of source. $15.99</p>
      </div>
      <div class="dish">
        <h3>Margherita Pizza</h3>
        <p>
          Classic Italian pizza with fresh mozarella, tomatoes, and basil.
          $12.99.
        </p>
      </div>
    </div>
  </body>
</html>
